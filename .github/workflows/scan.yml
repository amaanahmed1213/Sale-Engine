name: Find deals

on:
  schedule:
    - cron: "7 14 * * *"
    - cron: "37 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Find codes, scan sales, check watchlist
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          python run.py codes || true
          python run.py check || true
          python run.py scan  || true
      - name: Save price history + publish site
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add prices.db docs/
          git commit -m "Deals update" || echo "nothing new"
          git push
